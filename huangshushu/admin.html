<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>HSS 後台 - 庫存管理</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="data:,">

  <style>
    :root {
      --hss-primary: #c9a575;
      --hss-dark:    #5a3a2e;
      --hss-bg:      #fff8ee;
      --hss-warn:    #e8a93a;
      --hss-danger:  #c43c3c;
      --hss-ok:      #2e8b57;
    }
    body {
      background: linear-gradient(180deg, var(--hss-bg) 0%, #fff 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
      padding-bottom: 100px;
    }
    .navbar-admin {
      background: var(--hss-dark);
      color: #fff;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .navbar-admin h1 { font-size: 1.05rem; font-weight: 700; margin: 0; }
    .navbar-admin .badge-status {
      background: var(--hss-primary);
      color: #fff;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
    }

    .container-admin { max-width: 520px; margin: 0 auto; padding: 16px; }

    .info-box {
      background: #fff;
      border-left: 4px solid var(--hss-primary);
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #6b5546;
      box-shadow: 0 2px 6px rgba(0,0,0,.04);
    }

    /* === 編輯模式相關 === */
    .mode-bar {
      background: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .mode-bar .status-label {
      font-size: 0.85rem;
      color: #666;
    }
    .mode-bar.is-editing {
      background: #fff5e0;
      border: 1px solid var(--hss-warn);
    }
    .mode-bar.is-editing .status-label {
      color: var(--hss-warn);
      font-weight: 600;
    }
    .mode-bar .badge-dirty {
      background: var(--hss-danger);
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      margin-left: 6px;
      display: none;
    }
    .mode-bar .badge-dirty.show { display: inline-block; }

    .product-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all .25s ease;
      position: relative;
    }
    .product-card.is-off { background: #f5f5f5; opacity: 0.75; }
    .product-card .name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--hss-dark);
    }
    .product-card .sku {
      font-size: 0.72rem;
      color: #999;
      font-family: monospace;
    }
    .product-card .status-text { font-size: 0.75rem; margin-top: 2px; }
    .status-text.on  { color: var(--hss-ok); }
    .status-text.off { color: var(--hss-danger); }

    /* 未儲存變更:卡片左側出現黃色標記 */
    .product-card.is-dirty::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 4px;
      background: var(--hss-warn);
      border-radius: 4px;
    }
    .product-card.is-dirty .name::after {
      content: ' • 未儲存';
      color: var(--hss-warn);
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* 開關 */
    .form-switch .form-check-input {
      width: 3.2em;
      height: 1.7em;
      cursor: pointer;
    }
    .form-switch .form-check-input:checked {
      background-color: var(--hss-primary);
      border-color: var(--hss-primary);
    }
    .form-switch .form-check-input:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    /* 登入區 */
    .login-overlay {
      position: fixed; inset: 0;
      background: rgba(255,248,238,.95);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.15);
      width: 100%; max-width: 360px;
      text-align: center;
    }
    .login-box h2 {
      font-size: 1.3rem;
      color: var(--hss-dark);
      font-weight: 700;
      margin-bottom: 18px;
    }
    .btn-hss {
      background: var(--hss-primary);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    .btn-hss:hover { background: var(--hss-dark); color: #fff; }

    /* 底部固定操作條(編輯模式才出現) */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 20px rgba(0,0,0,.1);
      display: none;
      gap: 10px;
      z-index: 50;
    }
    .bottom-bar.show { display: flex; }
    .bottom-bar > * { flex: 1; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9000;
    }

    .skeleton {
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: skel 1.2s infinite;
      height: 60px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    @keyframes skel { 
      0% { background-position: 200% 0; } 
      100% { background-position: -200% 0; } 
    }
  </style>
</head>

<body>

<!-- ========== 登入遮罩 ========== -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>🔐 HSS 後台登入</h2>
    <p class="text-muted small mb-3">請輸入管理密碼進入庫存控制台</p>
    <input type="text" class="form-control form-control-lg text-center mb-3" 
           id="loginPassword" placeholder="管理密碼" autocomplete="current-password">
    <button class="btn btn-hss btn-lg w-100" id="loginBtn">進入後台</button>
    <p class="text-muted small mt-3 mb-0">⚠️ 密碼僅暫存於此次瀏覽器分頁,關閉後自動清除</p>
  </div>
</div>

<!-- ========== 頂部 Navbar ========== -->
<div class="navbar-admin">
  <div>
    <h1>🥔 HSS 庫存管理</h1>
  </div>
  <div>
    <span class="badge-status" id="navStatus">載入中...</span>
    <button class="btn btn-sm btn-outline-light ms-2" id="btnLogout" style="display:none;">登出</button>
  </div>
</div>

<!-- ========== 主內容 ========== -->
<div class="container-admin">

  <div class="info-box">
    💡 點 <strong>「✏️ 編輯」</strong> 才能切換開關。<br>
    切換後狀態為暫存,需按 <strong>「💾 儲存」</strong> 才會生效。
  </div>

  <!-- 模式列(顯示/編輯狀態) -->
  <div class="mode-bar" id="modeBar">
    <div>
      <span class="status-label" id="modeLabel">📋 檢視模式</span>
      <span class="badge-dirty" id="dirtyBadge">0 筆未儲存</span>
    </div>
    <button class="btn btn-sm btn-hss" id="btnEnterEdit">✏️ 編輯</button>
  </div>

  <div id="productList">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <div class="text-center text-muted small mt-4" id="footerInfo"></div>
</div>

<!-- 底部固定操作條(編輯模式才出現) -->
<div class="bottom-bar" id="bottomBar">
  <button class="btn btn-outline-secondary" id="btnCancelEdit">取消</button>
  <button class="btn btn-hss" id="btnSaveAll">💾 儲存全部變更</button>
</div>

<!-- Toast 區 -->
<div class="toast-container" id="toastContainer"></div>


<script>
/* =====================================================
 * HSS 後台 — 編輯模式 + 批次儲存
 * ===================================================== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx-K7vc0XhHXgiL0bWcWgFuEZS-BIDg8GQIEEqZWmfK1E0txaG-qIRZg-X74npowVvN/exec';
const FRONTEND_ORIGIN = window.location.origin;

const PRODUCTS = [
  { sku: 'plum_fries',             name: '甘梅薯條' },
  { sku: 'rock_fries',             name: '搖滾脆薯' },
  { sku: 'sweetpotato_ball',       name: '爆漿地瓜球' },
  { sku: 'king_oyster_mushroom',   name: '杏鮑菇' },
  { sku: 'shimeji_mushroom',       name: '秀珍菇' },
  { sku: 'enoki_mushroom',         name: '金針菇' },
  { sku: 'taro_cake',              name: '芋頭餅' },
  { sku: 'cheese_stick',           name: '起司棒' },
  { sku: 'corn_custard_pastry',    name: '玉米布丁酥' },
  { sku: 'radish_cake',            name: '蘿蔔糕' },
  { sku: 'purple_rice_cake',       name: '紫米糕' },
  { sku: 'mixed_potato_platter',   name: '薯類綜合' },
  { sku: 'mixed_mushroom_platter', name: '菇類綜合' },
  { sku: 'mixed_combo_platter',    name: '全部綜合' }
];

// ====== 狀態管理 ======
let isEditMode = false;
let originalStatus = {};   // 從 GAS 拿到的「真實狀態」
let draftStatus = {};      // 編輯中的草稿狀態

// ====== 工具:Toast ======
function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const id = 'toast_' + Date.now();
  const color = type === 'success' ? 'bg-success' :
                type === 'warning' ? 'bg-warning text-dark' : 'bg-danger';
  const html = `
    <div id="${id}" class="toast align-items-center text-white ${color} border-0 mb-2" 
         role="alert">
      <div class="d-flex">
        <div class="toast-body">${msg}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" 
                data-bs-dismiss="toast"></button>
      </div>
    </div>`;
  container.insertAdjacentHTML('beforeend', html);
  const el = document.getElementById(id);
  const toast = new bootstrap.Toast(el, { delay: 2800 });
  toast.show();
  el.addEventListener('hidden.bs.toast', () => el.remove());
}

// ====== 登入 ======
const SS_KEY = 'hss_admin_pwd';
function getStoredPassword() { return sessionStorage.getItem(SS_KEY) || ''; }
function setStoredPassword(p) { sessionStorage.setItem(SS_KEY, p); }
function clearStoredPassword() { sessionStorage.removeItem(SS_KEY); }

function showLogin() {
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('btnLogout').style.display = 'none';
}
function hideLogin() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('btnLogout').style.display = '';
}

async function tryLogin(pwd) {
  // 用「空 changes 陣列」探測:密碼錯回 ERROR_ADMIN_AUTH,對則回 ERROR_CHANGES_EMPTY
  const body = new URLSearchParams();
  body.append('action',   'batchUpdateCatalogStatus');
  body.append('origin',   FRONTEND_ORIGIN);
  body.append('changes',  '[]');
  body.append('password', pwd);

  try {
    const resp = await fetch(GAS_URL, { method: 'POST', body });
    const data = await resp.json();
    if (data.error === 'ERROR_ADMIN_AUTH') return false;
    if (data.error === 'ERROR_BAD_ORIGIN') {
      showToast('來源驗證失敗,請從正式網址開啟', 'danger');
      return false;
    }
    return true;
  } catch (err) {
    showToast('網路錯誤,請檢查連線', 'danger');
    return false;
  }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const pwd = document.getElementById('loginPassword').value;
  if (!pwd) { showToast('請輸入密碼', 'warning'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '驗證中...';

  const ok = await tryLogin(pwd);

  btn.disabled = false;
  btn.textContent = '進入後台';

  if (ok) {
    setStoredPassword(pwd);
    hideLogin();
    showToast('登入成功');
    loadCatalog();
  } else {
    showToast('密碼錯誤', 'danger');
    document.getElementById('loginPassword').value = '';
  }
});
document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('btnLogout').addEventListener('click', () => {
  if (isEditMode && countDirty() > 0) {
    if (!confirm('您有未儲存的變更,確定要登出?')) return;
  }
  clearStoredPassword();
  showLogin();
  showToast('已登出', 'warning');
});

// ====== 載入庫存 ======
async function loadCatalog() {
  const list = document.getElementById('productList');
  document.getElementById('navStatus').textContent = '載入中...';

  const body = new URLSearchParams();
  body.append('action', 'getCatalogStatus');
  body.append('origin', FRONTEND_ORIGIN);

  try {
    const resp = await fetch(GAS_URL, { method: 'POST', body });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'fail');

    originalStatus = {};
    PRODUCTS.forEach(p => {
      originalStatus[p.sku] = (data.status[p.sku] !== false);
    });
    draftStatus = { ...originalStatus };

    renderProducts();
    document.getElementById('navStatus').textContent = '✅ 已連線';
    document.getElementById('navStatus').style.background = '#2e8b57';
    updateModeBar();

  } catch (err) {
    console.error(err);
    list.innerHTML = `
      <div class="alert alert-danger">
        ❌ 無法讀取庫存狀態:${err.message || '連線失敗'}<br>
        <button class="btn btn-sm btn-outline-dark mt-2" onclick="loadCatalog()">重試</button>
      </div>`;
    document.getElementById('navStatus').textContent = '⚠️ 連線錯誤';
    document.getElementById('navStatus').style.background = '#c43c3c';
  }
}

// ====== 渲染商品列表 ======
function renderProducts() {
  const list = document.getElementById('productList');
  list.innerHTML = '';

  PRODUCTS.forEach(p => {
    const isOn = draftStatus[p.sku];
    const isDirty = (draftStatus[p.sku] !== originalStatus[p.sku]);

    const card = document.createElement('div');
    card.className = 'product-card' 
      + (isOn ? '' : ' is-off')
      + (isDirty ? ' is-dirty' : '');
    card.dataset.sku = p.sku;
    card.innerHTML = `
      <div>
        <div class="name">${p.name}</div>
        <div class="sku">${p.sku}</div>
        <div class="status-text ${isOn ? 'on' : 'off'}">
          ${isOn ? '✅ 販售中' : '⛔ 已售完'}
        </div>
      </div>
      <div class="form-check form-switch m-0">
        <input class="form-check-input" type="checkbox" role="switch"
               id="sw_${p.sku}" 
               ${isOn ? 'checked' : ''}
               ${isEditMode ? '' : 'disabled'}>
      </div>
    `;
    list.appendChild(card);

    const sw = card.querySelector('.form-check-input');
    sw.addEventListener('change', () => {
      draftStatus[p.sku] = sw.checked;
      renderProducts();   // 重新渲染以更新「未儲存」標記
      updateModeBar();
    });
  });

  document.getElementById('footerInfo').textContent = 
    `共 ${PRODUCTS.length} 項商品 · 最後同步:${new Date().toLocaleTimeString()}`;
}

// ====== 計算有幾筆未儲存 ======
function countDirty() {
  return PRODUCTS.filter(p => draftStatus[p.sku] !== originalStatus[p.sku]).length;
}

// ====== 更新模式列 / 底部操作條 ======
function updateModeBar() {
  const modeBar = document.getElementById('modeBar');
  const modeLabel = document.getElementById('modeLabel');
  const btnEnterEdit = document.getElementById('btnEnterEdit');
  const bottomBar = document.getElementById('bottomBar');
  const dirtyBadge = document.getElementById('dirtyBadge');

  const dirtyCount = countDirty();

  if (isEditMode) {
    modeBar.classList.add('is-editing');
    modeLabel.textContent = '✏️ 編輯模式';
    btnEnterEdit.style.display = 'none';
    bottomBar.classList.add('show');
  } else {
    modeBar.classList.remove('is-editing');
    modeLabel.textContent = '📋 檢視模式';
    btnEnterEdit.style.display = '';
    bottomBar.classList.remove('show');
  }

  if (dirtyCount > 0) {
    dirtyBadge.textContent = `${dirtyCount} 筆未儲存`;
    dirtyBadge.classList.add('show');
  } else {
    dirtyBadge.classList.remove('show');
  }
}

// ====== 進入編輯模式 ======
document.getElementById('btnEnterEdit').addEventListener('click', () => {
  isEditMode = true;
  draftStatus = { ...originalStatus };  // 重置草稿
  renderProducts();
  updateModeBar();
  showToast('已進入編輯模式');
});

// ====== 取消編輯(放棄變更)======
document.getElementById('btnCancelEdit').addEventListener('click', () => {
  const dirtyCount = countDirty();
  if (dirtyCount > 0) {
    if (!confirm(`有 ${dirtyCount} 筆未儲存的變更,確定要放棄?`)) return;
  }
  isEditMode = false;
  draftStatus = { ...originalStatus };
  renderProducts();
  updateModeBar();
  showToast('已取消編輯', 'warning');
});

// ====== 批次儲存 ======
document.getElementById('btnSaveAll').addEventListener('click', async () => {
  const dirtyCount = countDirty();
  if (dirtyCount === 0) {
    showToast('沒有需要儲存的變更', 'warning');
    return;
  }

  // 組出變更清單
  const changes = PRODUCTS
    .filter(p => draftStatus[p.sku] !== originalStatus[p.sku])
    .map(p => ({
      sku: p.sku,
      status: draftStatus[p.sku] ? 'ON' : 'OFF'
    }));

  const btn = document.getElementById('btnSaveAll');
  const btnCancel = document.getElementById('btnCancelEdit');
  btn.disabled = true;
  btnCancel.disabled = true;
  btn.textContent = '儲存中...';

  const body = new URLSearchParams();
  body.append('action',   'batchUpdateCatalogStatus');
  body.append('origin',   FRONTEND_ORIGIN);
  body.append('changes',  JSON.stringify(changes));
  body.append('password', getStoredPassword());

  try {
    const resp = await fetch(GAS_URL, { method: 'POST', body });
    const data = await resp.json();

    if (!data.ok) {
      if (data.error === 'ERROR_ADMIN_AUTH') {
        showToast('密碼已失效,請重新登入', 'danger');
        clearStoredPassword();
        showLogin();
        return;
      }
      throw new Error(data.error || '未知錯誤');
    }

    // 成功
    showToast(`✅ 已儲存 ${data.updatedCount} 筆變更`);
    
    // 把草稿狀態固化成「正式狀態」
    PRODUCTS.forEach(p => {
      originalStatus[p.sku] = draftStatus[p.sku];
    });

    // 退出編輯模式
    isEditMode = false;
    renderProducts();
    updateModeBar();

  } catch (err) {
    console.error(err);
    showToast(`儲存失敗:${err.message}`, 'danger');
  } finally {
    btn.disabled = false;
    btnCancel.disabled = false;
    btn.textContent = '💾 儲存全部變更';
  }
});

// ====== 離開頁面前提醒 ======
window.addEventListener('beforeunload', (e) => {
  if (isEditMode && countDirty() > 0) {
    e.preventDefault();
    e.returnValue = '您有未儲存的變更,確定要離開?';
  }
});

// ====== 啟動 ======
window.addEventListener('DOMContentLoaded', () => {
  if (getStoredPassword()) {
    hideLogin();
    loadCatalog();
  } else {
    showLogin();
    document.getElementById('loginPassword').focus();
  }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
